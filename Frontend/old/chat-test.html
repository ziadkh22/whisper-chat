<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whisper Chat Tester</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    body { max-width: 760px; margin: 32px auto; padding: 0 16px; font: 16px Arial, sans-serif; }
    input, button { box-sizing: border-box; padding: 10px; margin: 4px 0; }
    input { width: 100%; }
    button { cursor: pointer; }
    #messages { height: 280px; overflow-y: auto; border: 1px solid #aaa; padding: 10px; }
    #status { font-weight: bold; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
  </style>
</head>
<body>
  <h1>Whisper Chat Tester</h1>
  <p>Log in, connect, then join the same room from two browser tabs.</p>
  <p><a href="login.html">Use the separate login page</a> · <a href="rooms.html">Create or join a room</a></p>

  <label for="apiUrl">API base URL</label>
  <input id="apiUrl" value="http://localhost:3000" />

  <label for="email">Email</label>
  <input id="email" type="email" placeholder="your registered email" />

  <label for="password">Password</label>
  <input id="password" type="password" placeholder="your password" />
  <button id="loginButton">Log in and connect</button>
  <p id="status">Not connected</p>

  <label for="roomId">Room ID</label>
  <div class="row">
    <input id="roomId" placeholder="Paste a room ID" />
    <button id="joinButton">Join room</button>
  </div>

  <h2>Messages</h2>
  <div id="messages"></div>
  <form id="messageForm" class="row">
    <input id="messageText" placeholder="Write a message" autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script>
    let socket = null;
    const $ = (id) => document.getElementById(id);
    const show = (text) => {
      const line = document.createElement('p');
      line.textContent = text;
      $('messages').appendChild(line);
      $('messages').scrollTop = $('messages').scrollHeight;
    };

    $('loginButton').addEventListener('click', async () => {
      const baseUrl = $('apiUrl').value.trim().replace(/\/$/, '');
      $('status').textContent = 'Logging in...';
      try {
        const response = await fetch(`${baseUrl}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('email').value, password: $('password').value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || JSON.stringify(data));
        if (!data.Token) throw new Error('Login response did not include a Token.');

        if (socket) socket.disconnect();
        socket = io(baseUrl, { query: { token: data.Token } });
        socket.on('connect', () => { $('status').textContent = `Connected (${socket.id})`; });
        socket.on('disconnect', () => { $('status').textContent = 'Disconnected'; });
        socket.on('connect_error', (error) => show(`Connection error: ${error.message}`));
        socket.on('error', (error) => show(`Server error: ${typeof error === 'string' ? error : JSON.stringify(error)}`));
        socket.on('joined-room', ({ roomid }) => show(`Joined room ${roomid}`));
        socket.on('new-message', (message) => {
          const username = message.user?.username || 'Unknown user';
          show(`${username}: ${message.text}`);
        });
        socket.on('user-typing', (user) => show(`${user.username} is typing...`));
        socket.on('user-stopped-typing', (user) => show(`${user.username} stopped typing.`));
        show('Login successful. Connecting to chat...');
      } catch (error) {
        $('status').textContent = 'Login/connection failed';
        show(error.message);
      }
    });

    $('joinButton').addEventListener('click', () => {
      const roomid = $('roomId').value.trim();
      if (!socket?.connected) return show('Log in and connect first.');
      if (!roomid) return show('Enter a room ID first.');
      socket.emit('join-room', { roomid });
    });

    $('messageForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const roomid = $('roomId').value.trim();
      const text = $('messageText').value.trim();
      if (!socket?.connected) return show('Connect before sending a message.');
      if (!roomid) return show('Join a room first.');
      if (!text) return;
      socket.emit('send-message', { roomid, text });
      $('messageText').value = '';
    });

    $('messageText').addEventListener('input', () => {
      const roomid = $('roomId').value.trim();
      if (socket?.connected && roomid) socket.emit('typing-start', { roomid });
    });
    $('messageText').addEventListener('blur', () => {
      const roomid = $('roomId').value.trim();
      if (socket?.connected && roomid) socket.emit('typing-stop', { roomid });
    });
  </script>
</body>
</html>
